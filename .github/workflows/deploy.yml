name: Deploy to GitHub Pages

on:
  push:
    branches: [main, podcast-player]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Podcast Index config from secrets
        run: |
          cat > config.local.js <<'EOF'
          // Auto-generated at deploy time from repository secrets. Not committed.
          window.__PODCAST_PROVIDER__ = 'podcastindex';
          window.__PODCAST_PI_KEY__ = '${{ secrets.PI_KEY }}';
          window.__PODCAST_PI_SECRET__ = '${{ secrets.PI_SECRET }}';
          window.__PODCAST_PI_BASE_URL__ = 'https://api.podcastindex.org/api/1.0';
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
